<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Numerical Methods Visualizer</title>
<link rel="stylesheet" href="style.css">
<!-- math.js: safe expression parser (no eval) -->
<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<header><h1>Numerical Methods Visualizer</h1><span>VTU · Numerical Methods and Applications</span></header>
<main>
  <nav id="sidebar"></nav>
  <div class="resizer" data-side="left" title="Drag to resize (double-click to reset)"></div>
  <section id="view"><div id="canvas-wrap"></div><div id="labels"></div><div id="hint"></div></section>
  <div class="resizer" data-side="right" title="Drag to resize (double-click to reset)"></div>
  <aside id="panel">
    <h2 id="mTitle"></h2>
    <p id="mDesc"></p>
    <div id="fields"></div>
    <div class="btns"><button id="solveBtn">Solve &amp; Visualize</button><button id="resetBtn" class="sec">Reset</button></div>
    <div id="error"></div>
    <div id="results"></div>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
